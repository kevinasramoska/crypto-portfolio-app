# backend/src/main/resources/application.yaml
spring:
  application:
    name: crypto-portfolio-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptodb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-32-bytes-minimum}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

crypto:
  api:
    base-url: ${CRYPTO_API_BASE_URL:https://api.coingecko.com/api/v3}

portfolio:
  snapshots:
    scheduling:
      fixed-delay-ms: ${PORTFOLIO_SNAPSHOT_FIXED_DELAY_MS:3600000}
      initial-delay-ms: ${PORTFOLIO_SNAPSHOT_INITIAL_DELAY_MS:300000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

rate-limit:
  auth:
    max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  market:
    max-requests: ${MARKET_RATE_LIMIT_MAX_REQUESTS:60}
    window-seconds: ${MARKET_RATE_LIMIT_WINDOW_SECONDS:60}
