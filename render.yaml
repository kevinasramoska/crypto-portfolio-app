# Render Blueprint for the public portfolio demo of the Spring Boot API.
# Free plan: the service sleeps after ~15 minutes idle and takes ~1 minute to wake.
# Secrets marked `sync: false` are entered once in the Render dashboard, never committed.
# Step-by-step setup (Neon database, Render API, Vercel frontend): docs/FREE_TIER_DEPLOYMENT.md
services:
  - type: web
    name: crypto-portfolio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Neon JDBC URL, e.g. jdbc:postgresql://<host>/<db>?sslmode=verify-full&sslrootcert=/etc/pki/tls/certs/ca-bundle.crt
      # (ProductionSafetyConfig rejects sslfactory/sslhostnameverifier overrides.)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Render generates a random 256-bit value on first deploy (meets the 32-byte minimum).
      - key: JWT_SECRET
        generateValue: true
      # Exact HTTPS origin of the Vercel frontend, e.g. https://crypto-portfolio.vercel.app
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Keep the JVM inside the free instance's 512 MB memory limit.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
